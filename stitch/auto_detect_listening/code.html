<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#005048",
              "on-tertiary-container": "#002074",
              "surface": "#101321",
              "background": "#101321",
              "tertiary": "#b7c4ff",
              "surface-container-highest": "#313443",
              "surface-container-high": "#262938",
              "on-secondary-container": "#003f38",
              "surface-variant": "#313443",
              "on-tertiary-fixed-variant": "#0038b8",
              "on-primary-container": "#340080",
              "on-error-container": "#ffdad6",
              "primary-container": "#a078ff",
              "on-surface-variant": "#cbc3d7",
              "inverse-surface": "#e0e1f6",
              "error-container": "#93000a",
              "secondary-fixed-dim": "#4fdbc8",
              "on-background": "#e0e1f6",
              "surface-container-low": "#181b29",
              "surface-bright": "#363848",
              "on-tertiary-fixed": "#001453",
              "secondary": "#4fdbc8",
              "outline": "#958ea0",
              "outline-variant": "#494454",
              "on-secondary-fixed": "#00201c",
              "on-tertiary": "#002584",
              "primary": "#d0bcff",
              "surface-tint": "#d0bcff",
              "on-error": "#690005",
              "on-primary-fixed-variant": "#5516be",
              "inverse-on-surface": "#2d303f",
              "tertiary-container": "#6b89ff",
              "tertiary-fixed-dim": "#b7c4ff",
              "surface-dim": "#101321",
              "surface-container-lowest": "#0a0d1b",
              "on-primary": "#3c0091",
              "primary-fixed": "#e9ddff",
              "secondary-fixed": "#71f8e4",
              "inverse-primary": "#6d3bd7",
              "on-primary-fixed": "#23005c",
              "error": "#ffb4ab",
              "on-secondary": "#003731",
              "tertiary-fixed": "#dde1ff",
              "surface-container": "#1c1f2d",
              "primary-fixed-dim": "#d0bcff",
              "secondary-container": "#04b4a2",
              "on-surface": "#e0e1f6"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .glass-panel {
            background: rgba(49, 52, 67, 0.6);
            backdrop-filter: blur(12px);
        }
        .signature-gradient {
            background: linear-gradient(135deg, #14B8A6 0%, #5B7CFA 50%, #8B5CF6 100%);
        }
        .ambient-glow {
            box-shadow: 0 0 40px -10px rgba(139, 92, 246, 0.3);
        }
        .waveform-bar {
            width: 4px;
            background: #4fdbc8;
            border-radius: 9999px;
            margin: 0 2px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col overflow-hidden">
<!-- Top Navigation (Shell Component) -->
<header class="flex items-center justify-between px-6 py-4 h-16">
<button class="p-2 hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-lg tracking-tight">Voxa</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 flex flex-col items-center justify-center px-8 relative">
<!-- Ambient Background Glows -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary opacity-10 blur-[100px] rounded-full"></div>
<div class="absolute bottom-0 right-0 w-64 h-64 bg-secondary opacity-5 blur-[100px] rounded-full"></div>
<!-- Listening Status Section -->
<div class="text-center mb-12 relative z-10">
<div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-secondary-container/20 border border-secondary/10 mb-6">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="text-secondary font-label text-xs uppercase tracking-widest font-semibold">Auto-Detecting</span>
</div>
<h2 class="font-headline text-4xl font-extrabold text-on-surface mb-4 tracking-tight">Listening for pitch...</h2>
<p class="text-on-surface-variant text-md max-w-xs mx-auto leading-relaxed">
                Take a deep breath and start speaking or humming when you're ready.
            </p>
</div>
<!-- Central Visualization (The Sanctuary) -->
<div class="relative w-full max-w-sm aspect-square flex items-center justify-center mb-12">
<!-- Glassmorphic Container -->
<div class="absolute inset-0 rounded-xl glass-panel border border-outline-variant/15 flex items-center justify-center overflow-hidden">
<!-- Static Waveform Representation (Simulating Live State) -->
<div class="flex items-end gap-1.5 h-32 px-8">
<div class="waveform-bar" style="height: 40%;"></div>
<div class="waveform-bar" style="height: 60%;"></div>
<div class="waveform-bar" style="height: 35%;"></div>
<div class="waveform-bar" style="height: 85%;"></div>
<div class="waveform-bar" style="height: 55%;"></div>
<div class="waveform-bar" style="height: 70%;"></div>
<div class="waveform-bar" style="height: 95%;"></div>
<div class="waveform-bar" style="height: 60%;"></div>
<div class="waveform-bar" style="height: 45%;"></div>
<div class="waveform-bar" style="height: 80%;"></div>
<div class="waveform-bar" style="height: 30%;"></div>
<div class="waveform-bar" style="height: 50%;"></div>
<div class="waveform-bar" style="height: 65%;"></div>
</div>
<!-- Overlay Gradient for Technical Look -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/80 to-transparent pointer-events-none"></div>
</div>
<!-- Focus Element -->
<div class="absolute w-24 h-24 rounded-full signature-gradient ambient-glow flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-4xl" data-weight="fill">mic</span>
</div>
</div>
<!-- Technical Stats Bento Grid -->
<div class="grid grid-cols-2 gap-4 w-full max-w-sm mb-12 relative z-10">
<div class="p-5 rounded-lg bg-surface-container-low border border-outline-variant/10">
<span class="text-on-surface-variant font-label text-[10px] uppercase tracking-wider block mb-1">Duration</span>
<span class="font-headline text-2xl font-bold text-on-surface">00:42</span>
</div>
<div class="p-5 rounded-lg bg-surface-container-low border border-outline-variant/10">
<span class="text-on-surface-variant font-label text-[10px] uppercase tracking-wider block mb-1">Ambience</span>
<span class="font-headline text-2xl font-bold text-secondary">Optimal</span>
</div>
</div>
<!-- Controls -->
<div class="w-full max-w-sm flex flex-col gap-4 relative z-10">
<button class="w-full h-[56px] rounded-full signature-gradient text-on-primary font-headline font-bold text-lg shadow-lg shadow-primary/20 hover:scale-[1.02] transition-transform">
                Stop &amp; Analyze
            </button>
<button class="w-full h-[56px] rounded-full bg-surface-container-high text-on-surface-variant font-headline font-semibold text-md hover:bg-surface-container-highest transition-colors">
                Cancel
            </button>
</div>
</main>
<!-- Bottom Indicator for Progress (Editorial Style) -->
<div class="px-8 pb-10 flex items-center gap-4">
<div class="flex-1 h-1.5 rounded-full bg-surface-container-highest overflow-hidden">
<div class="h-full signature-gradient w-1/3 rounded-full"></div>
</div>
<span class="text-on-surface-variant font-label text-xs">Processing Input</span>
</div>
<!-- Floating UI Accessory (FAB - Shell Component) -->
<div class="fixed bottom-10 right-6 z-50">
<button class="flex items-center gap-3 px-6 h-[56px] rounded-full signature-gradient text-on-primary shadow-xl hover:shadow-primary/40 transition-all">
<span class="material-symbols-outlined">graphic_eq</span>
<span class="font-headline font-bold">Live Pitch</span>
</button>
</div>
</body></html>
