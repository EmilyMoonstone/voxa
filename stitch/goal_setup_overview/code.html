<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Voxa - Goal Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#005048",
                        "on-tertiary-container": "#002074",
                        "surface": "#101321",
                        "background": "#101321",
                        "tertiary": "#b7c4ff",
                        "surface-container-highest": "#313443",
                        "surface-container-high": "#262938",
                        "on-secondary-container": "#003f38",
                        "surface-variant": "#313443",
                        "on-tertiary-fixed-variant": "#0038b8",
                        "on-primary-container": "#340080",
                        "on-error-container": "#ffdad6",
                        "primary-container": "#a078ff",
                        "on-surface-variant": "#cbc3d7",
                        "inverse-surface": "#e0e1f6",
                        "error-container": "#93000a",
                        "secondary-fixed-dim": "#4fdbc8",
                        "on-background": "#e0e1f6",
                        "surface-container-low": "#181b29",
                        "surface-bright": "#363848",
                        "on-tertiary-fixed": "#001453",
                        "secondary": "#4fdbc8",
                        "outline": "#958ea0",
                        "outline-variant": "#494454",
                        "on-secondary-fixed": "#00201c",
                        "on-tertiary": "#002584",
                        "primary": "#d0bcff",
                        "surface-tint": "#d0bcff",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#5516be",
                        "inverse-on-surface": "#2d303f",
                        "tertiary-container": "#6b89ff",
                        "tertiary-fixed-dim": "#b7c4ff",
                        "surface-dim": "#101321",
                        "surface-container-lowest": "#0a0d1b",
                        "on-primary": "#3c0091",
                        "primary-fixed": "#e9ddff",
                        "secondary-fixed": "#71f8e4",
                        "inverse-primary": "#6d3bd7",
                        "on-primary-fixed": "#23005c",
                        "error": "#ffb4ab",
                        "on-secondary": "#003731",
                        "tertiary-fixed": "#dde1ff",
                        "surface-container": "#1c1f2d",
                        "primary-fixed-dim": "#d0bcff",
                        "secondary-container": "#04b4a2",
                        "on-surface": "#e0e1f6"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }

<style>
        .glass-card {
            background: rgba(49, 52, 67, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(149, 142, 160, 0.15);
        }
        .gradient-text {
            background: linear-gradient(135deg, #14B8A6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .signature-gradient {
            background: linear-gradient(135deg, #14B8A6, #8B5CF6);
        }
        .ambient-glow {
            box-shadow: 0 0 40px -10px rgba(139, 92, 246, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 min-h-screen flex flex-col">
<!-- Top Navigation -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md px-6 py-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface cursor-pointer">arrow_back</span>
<h1 class="font-headline text-xl font-bold tracking-tight">Voxa</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center border border-outline-variant/20">
<span class="material-symbols-outlined text-on-surface-variant text-xl">account_circle</span>
</div>
</header>
<main class="flex-grow px-6 py-8 max-w-2xl mx-auto w-full">
<!-- Hero Section -->
<section class="mb-12">
<span class="text-secondary font-label tracking-widest text-xs uppercase mb-3 block">Step 1 of 3</span>
<h2 class="font-headline text-4xl font-extrabold leading-tight mb-4">Choose your <span class="gradient-text">vocal path</span>.</h2>
<p class="text-on-surface-variant leading-relaxed">Select the goal that resonates with your identity. We'll calibrate your practice ranges accordingly.</p>
</section>
<!-- Goal Grid -->
<div class="grid grid-cols-1 gap-4 mb-24">
<!-- Feminine Card -->
<button class="glass-card p-6 rounded-xl text-left group transition-all hover:scale-[1.02] active:scale-[0.98] relative overflow-hidden">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-6xl">female</span>
</div>
<div class="flex items-start justify-between mb-4">
<div class="w-12 h-12 rounded-lg bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-2xl">auto_awesome</span>
</div>
</div>
<h3 class="font-headline text-xl font-bold mb-2">Feminine</h3>
<p class="text-sm text-on-surface-variant leading-relaxed">Bright resonance and higher pitch frequencies designed for a soft, melodic expression.</p>
</button>
<!-- Masculine Card -->
<button class="glass-card p-6 rounded-xl text-left group transition-all hover:scale-[1.02] active:scale-[0.98] relative overflow-hidden">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-6xl">male</span>
</div>
<div class="flex items-start justify-between mb-4">
<div class="w-12 h-12 rounded-lg bg-secondary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-2xl">audio_magic_eraser</span>
</div>
</div>
<h3 class="font-headline text-xl font-bold mb-2">Masculine</h3>
<p class="text-sm text-on-surface-variant leading-relaxed">Deep chest resonance and steady pitch control for a grounded, resonant vocal presence.</p>
</button>
<!-- Androgynous Card -->
<button class="glass-card p-6 rounded-xl text-left group transition-all hover:scale-[1.02] active:scale-[0.98] relative overflow-hidden">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-6xl">transgender</span>
</div>
<div class="flex items-start justify-between mb-4">
<div class="w-12 h-12 rounded-lg bg-tertiary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary text-2xl">balance</span>
</div>
</div>
<h3 class="font-headline text-xl font-bold mb-2">Androgynous</h3>
<p class="text-sm text-on-surface-variant leading-relaxed">A balanced blend of tonal qualities, focusing on flexibility and unique vocal neutrality.</p>
</button>
<!-- Bento Bottom Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Custom Card -->
<button class="surface-container-low p-6 rounded-xl text-left group border border-outline-variant/10 hover:border-outline-variant/30 transition-all">
<div class="mb-4">
<span class="material-symbols-outlined text-on-surface-variant">settings_suggest</span>
</div>
<h3 class="font-headline text-lg font-bold mb-1">Custom</h3>
<p class="text-xs text-on-surface-variant">Set your own Hz ranges and specific resonance targets.</p>
</button>
<!-- Auto-detect Card -->
<button class="surface-container-low p-6 rounded-xl text-left group border border-outline-variant/10 hover:border-outline-variant/30 transition-all relative overflow-hidden">
<div class="absolute -right-4 -bottom-4 w-16 h-16 bg-secondary/10 blur-2xl rounded-full"></div>
<div class="mb-4">
<span class="material-symbols-outlined text-secondary">analytics</span>
</div>
<h3 class="font-headline text-lg font-bold mb-1">Auto-detect</h3>
<p class="text-xs text-on-surface-variant">Let AI analyze your natural voice and suggest a starting path.</p>
</button>
</div>
</div>
</main>
<!-- Floating UI Elements -->
<div class="fixed bottom-12 left-1/2 -translate-x-1/2 w-full max-w-md px-6 z-40">
<button class="signature-gradient ambient-glow w-full h-[56px] rounded-full flex items-center justify-center gap-2 text-on-primary font-bold shadow-2xl transition-transform active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
            Live Pitch
        </button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 h-20 bg-surface-container-high/80 backdrop-blur-xl border-t border-outline-variant/10 px-8 flex items-center justify-between z-30">
<div class="flex flex-col items-center gap-1 group cursor-pointer">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-[10px] font-label font-medium text-secondary">Home</span>
<div class="w-1 h-1 rounded-full bg-secondary mt-0.5"></div>
</div>
<div class="flex flex-col items-center gap-1 group cursor-pointer text-on-surface-variant">
<span class="material-symbols-outlined">mic</span>
<span class="text-[10px] font-label font-medium">Practice</span>
</div>
<div class="flex flex-col items-center gap-1 group cursor-pointer text-on-surface-variant">
<span class="material-symbols-outlined">history</span>
<span class="text-[10px] font-label font-medium">History</span>
</div>
<div class="flex flex-col items-center gap-1 group cursor-pointer text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-label font-medium">Settings</span>
</div>
</nav>
<!-- Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[60%] h-[60%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[40%] h-[40%] bg-secondary/5 rounded-full blur-[100px]"></div>
</div>
</body></html>
