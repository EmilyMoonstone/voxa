<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-low": "#181b29",
              "primary": "#d0bcff",
              "inverse-surface": "#e0e1f6",
              "on-primary-fixed": "#23005c",
              "outline-variant": "#494454",
              "surface-container-highest": "#313443",
              "secondary-fixed-dim": "#4fdbc8",
              "primary-fixed-dim": "#d0bcff",
              "on-background": "#e0e1f6",
              "on-secondary-fixed-variant": "#005048",
              "inverse-primary": "#6d3bd7",
              "surface-container-high": "#262938",
              "on-secondary-fixed": "#00201c",
              "surface-container": "#1c1f2d",
              "outline": "#958ea0",
              "tertiary": "#b7c4ff",
              "surface-dim": "#101321",
              "secondary-fixed": "#71f8e4",
              "surface-bright": "#363848",
              "on-secondary-container": "#003f38",
              "inverse-on-surface": "#2d303f",
              "on-error": "#690005",
              "tertiary-fixed": "#dde1ff",
              "surface": "#101321",
              "surface-tint": "#d0bcff",
              "secondary": "#4fdbc8",
              "on-tertiary-container": "#002074",
              "on-primary-container": "#340080",
              "background": "#101321",
              "tertiary-fixed-dim": "#b7c4ff",
              "secondary-container": "#04b4a2",
              "on-tertiary": "#002584",
              "on-error-container": "#ffdad6",
              "error-container": "#93000a",
              "on-surface-variant": "#cbc3d7",
              "tertiary-container": "#6b89ff",
              "on-secondary": "#003731",
              "primary-container": "#a078ff",
              "surface-container-lowest": "#0a0d1b",
              "error": "#ffb4ab",
              "surface-variant": "#313443",
              "primary-fixed": "#e9ddff",
              "on-tertiary-fixed-variant": "#0038b8",
              "on-primary-fixed-variant": "#5516be",
              "on-primary": "#3c0091",
              "on-tertiary-fixed": "#001453",
              "on-surface": "#e0e1f6"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            background-color: #101321;
            font-family: 'Inter', sans-serif;
        }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(49, 52, 67, 0.4);
            backdrop-filter: blur(12px);
        }
        .gradient-text {
            background: linear-gradient(135deg, #4fdbc8 0%, #d0bcff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .signature-gradient {
            background: linear-gradient(135deg, #04b4a2 0%, #6d3bd7 100%);
        }
        .chart-grid {
            background-image: linear-gradient(to right, rgba(149, 142, 160, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(149, 142, 160, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="h-16 flex items-center px-6 justify-between shrink-0">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="font-headline text-lg font-bold">Voxa</h1>
<div class="w-6"></div>
</header>
<main class="flex-1 flex flex-col px-6 pt-4 pb-24 overflow-y-auto">
<!-- Editorial Header Section -->
<section class="mb-8">
<p class="text-secondary font-label tracking-widest text-xs font-bold uppercase mb-2">Current Mode</p>
<h2 class="font-headline text-4xl font-extrabold text-on-surface leading-tight">Practice</h2>
<p class="text-on-surface-variant mt-2 max-w-[280px] leading-relaxed">Find your resonance. Your target range is waiting.</p>
</section>
<!-- Main Chart Card (Idle State) -->
<section class="relative w-full aspect-[4/5] rounded-xl overflow-hidden bg-surface-container-low border border-outline-variant/10 shadow-2xl mb-8">
<div class="absolute inset-0 chart-grid"></div>
<!-- Target Range Indicator (Visual Anchor) -->
<div class="absolute inset-x-0 top-1/3 bottom-1/4 bg-secondary/5 border-y border-secondary/20 flex flex-col justify-center items-center">
<div class="absolute inset-0 bg-gradient-to-r from-secondary/10 via-transparent to-primary/10 opacity-30"></div>
<div class="relative z-10 flex flex-col items-center">
<span class="text-secondary font-label text-[10px] tracking-[0.2em] font-bold uppercase mb-1">Target Zone</span>
<div class="flex items-baseline gap-1">
<span class="font-headline text-5xl font-extrabold text-on-surface">150</span>
<span class="text-on-surface-variant font-headline text-2xl font-light">to</span>
<span class="font-headline text-5xl font-extrabold text-on-surface">185</span>
</div>
<span class="text-on-surface-variant font-label text-sm mt-1">Hertz (Hz)</span>
</div>
</div>
<!-- Soft Background Glows -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary/10 blur-[80px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-64 h-64 bg-secondary/10 blur-[80px] rounded-full"></div>
<!-- Inactive Status Overlay -->
<div class="absolute bottom-6 left-6 right-6 flex justify-between items-end">
<div class="glass-card px-4 py-2 rounded-lg border border-outline-variant/20">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-outline animate-pulse"></div>
<span class="text-xs font-medium text-on-surface-variant">System Idle</span>
</div>
</div>
<div class="text-right">
<p class="text-[10px] font-label text-outline uppercase tracking-wider">Calibration</p>
<p class="text-sm font-semibold text-on-surface">Optimal</p>
</div>
</div>
</section>
<!-- Stats Grid (Bento Style) -->
<div class="grid grid-cols-2 gap-4 mb-8">
<div class="bg-surface-container-high p-5 rounded-lg flex flex-col gap-1">
<span class="text-outline text-[10px] font-bold uppercase tracking-wider">Daily Goal</span>
<span class="font-headline text-2xl font-bold text-on-surface">15 <span class="text-sm font-normal text-on-surface-variant">min</span></span>
<div class="w-full h-1 bg-surface-variant rounded-full mt-2 overflow-hidden">
<div class="h-full bg-secondary w-1/3 rounded-full"></div>
</div>
</div>
<div class="bg-surface-container-high p-5 rounded-lg flex flex-col gap-1">
<span class="text-outline text-[10px] font-bold uppercase tracking-wider">Stability</span>
<span class="font-headline text-2xl font-bold text-on-surface">88<span class="text-sm font-normal text-on-surface-variant">%</span></span>
<div class="flex items-center gap-1 mt-2">
<span class="material-symbols-outlined text-secondary text-xs" data-icon="trending_up">trending_up</span>
<span class="text-[10px] text-secondary font-medium">+4% from yesterday</span>
</div>
</div>
</div>
<!-- Call to Action -->
<div class="fixed bottom-32 left-0 right-0 px-6 flex justify-center z-20">
<button class="signature-gradient w-full h-16 rounded-full flex items-center justify-center gap-3 shadow-[0_12px_40px_-12px_rgba(4,180,162,0.4)] transition-transform active:scale-95">
<span class="material-symbols-outlined text-on-primary-fixed" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span class="font-headline font-extrabold text-on-primary-fixed text-lg">Start Practice</span>
</button>
</div>
</main>
<!-- FAB (Floating from JSON but visually integrated) -->
<div class="fixed bottom-28 right-6 z-30">
<button class="flex items-center gap-3 bg-primary-container h-14 px-6 rounded-lg shadow-xl border border-primary/20">
<span class="material-symbols-outlined text-on-primary-container" data-icon="graphic_eq">graphic_eq</span>
<span class="font-headline font-bold text-on-primary-container text-sm">Live Pitch</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 h-20 bg-surface-container-high/80 backdrop-blur-xl border-t border-outline-variant/10 flex items-center justify-around px-4 z-40">
<div class="flex flex-col items-center gap-1 opacity-40">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[10px] font-medium font-label">Home</span>
</div>
<div class="flex flex-col items-center gap-1 relative">
<div class="absolute -top-1 w-8 h-1 bg-secondary rounded-full shadow-[0_0_12px_rgba(79,219,200,0.6)]"></div>
<span class="material-symbols-outlined text-secondary" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
<span class="text-[10px] font-bold font-label text-secondary">Practice</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-40">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="text-[10px] font-medium font-label">History</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-40">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-[10px] font-medium font-label">Settings</span>
</div>
</nav>
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-20%] left-[-10%] w-[80%] h-[50%] bg-primary/5 blur-[120px] rounded-full rotate-12"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[40%] bg-secondary/5 blur-[100px] rounded-full -rotate-12"></div>
</div>
</body></html>
