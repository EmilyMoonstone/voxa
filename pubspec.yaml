name: voxa
description: "A voice training app for trans* people."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  audio_decoder: ^0.7.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  file_picker: ^10.1.9
  google_sign_in: ^6.3.0
  googleapis: ^14.0.0
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  http: ^1.5.0
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pitch_detector_dart: ^0.0.7
  record: ^6.2.0
  shared_preferences: ^2.5.4
  flutter_timezone: ^5.0.1
  timezone: ^0.11.0
  flutter_local_notifications: 21.0.0

dev_dependencies:
  build_runner: ^2.10.1
  drift_dev: ^2.32.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/voxa_logo.png
    - assets/logo/voxa_logo_bg.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/voxa_logo_bg.png
  adaptive_icon_background: "#0F1528"
  adaptive_icon_foreground: assets/logo/voxa_logo.png

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#F7F8FC"
  color_dark: "#0B1020"
  image: assets/logo/voxa_logo_bg.png
  image_dark: assets/logo/voxa_logo_bg.png
  android_12:
    color: "#F7F8FC"
    color_dark: "#0B1020"
    image: assets/logo/voxa_logo_bg.png
    image_dark: assets/logo/voxa_logo_bg.png
    icon_background_color: "#F7F8FC"
    icon_background_color_dark: "#0B1020"
